<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetrix Folie</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
<script>
(function () {
  var supported = ['fr', 'en', 'es', 'it'];
  var prefs = navigator.languages || [navigator.language || "en"];
  var lang = "en";
  for (var i = 0; i < prefs.length; i++) {
    var c = String(prefs[i]).slice(0, 2).toLowerCase();
    if (supported.indexOf(c) >= 0) { lang = c; break; }
  }
  location.replace(lang + "/privacy.html");
})();
</script>
</head>
<body>
<header class="hero">
  <a class="brand" href="index.html"><img src="assets/icon.png" alt="" width="64" height="64"><span>Tetrix Folie</span></a>
  <h1>Choose your language</h1>
</header>
<main><ul class="cards"><li><a href="fr/privacy.html" hreflang="fr" lang="fr">Français — Politique de confidentialité</a></li><li><a href="en/privacy.html" hreflang="en" lang="en">English — Privacy policy</a></li><li><a href="es/privacy.html" hreflang="es" lang="es">Español — Política de privacidad</a></li><li><a href="it/privacy.html" hreflang="it" lang="it">Italiano — Informativa sulla privacy</a></li></ul></main>
</body>
</html>
